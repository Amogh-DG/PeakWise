services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:5173
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE=http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
