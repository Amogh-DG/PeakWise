timezone: Asia/Kolkata
origin_hour_local: 10
quantiles:
  - 0.05
  - 0.1
  - 0.5
  - 0.9
  - 0.95
seed: 42
peak_threshold_quantile: 0.9
cdh_base_c: 24
paths:
